# Netlify config — used only if you deploy from a Git repo (Netlify builds it).
# For the drag-and-drop path you don't need this; the built dist/ is complete.
[build]
  command = "pnpm build"
  publish = "dist"

# Single-page app: serve index.html for any path so client routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
